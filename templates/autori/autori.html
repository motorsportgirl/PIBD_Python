<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <title>Vizualizare Autori</title>
</head>
<body class="container">
    <nav>
        <ul>
            <li><a href="/" class="secondary">◀ Înapoi la meniu</a></li>
            <li><strong>✍️ Gestiune Autori</strong></li>
        </ul>
        <ul>
            <li><a href="/autori/adaugare" role="button" class="outline">+ Adaugă </a></li>
        </ul>
    </nav>

    <form method="POST">
        <figure>
            <table>
                <thead>
                    <tr>
                        <th>Select</th>
                        <th>ID</th>
                        <th>Nume</th>
                        <th>Data Naștere</th>
                        <th>Naționalitate</th>
                    </tr>
                </thead>
                <tbody>
                    {% for a in date %}
                    <tr>
                        <td>
                            <input type="checkbox" name="selected_id" value="{{ a.IdAutor }}" onclick="selectieUnica(this)">
                        </td>
                        <td>{{ a.IdAutor }}</td>
                        <td>{{ a.Nume }}</td>
                        <td>{{ a.Data_nastere }}</td>
                        <td>{{ a.Nationalitate }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </figure>

        <footer style="display: flex; gap: 20px; justify-content: center; margin-top: 30px;">
            <button type="submit" name="action" value="modifica" class="warning">📝 Modifică</button>
            <button type="submit" name="action" value="sterge" class="secondary" onclick="return confirm('Sigur ștergi autorul selectat?')">🗑️ Șterge</button>
        </footer>
    </form>

    <script>
    function selectieUnica(checkbox) {
        var checkboxes = document.getElementsByName('selected_id');
        checkboxes.forEach((item) => {
            if (item !== checkbox) item.checked = false;
        });
    }
    </script>
</body>
</html>
